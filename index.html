
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lilac Petal Studio</title>
<style>
:root {
  --lilac: #E6D9F2;
  --purple: #C8A2E8;
  --deep: #59436F;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fffaff;
  color: var(--deep);
}
header {
  text-align: center;
  padding: 48px 18px;
  background: linear-gradient(135deg, #E6D9F2, #fff);
}
h1 { margin-bottom: 8px; }
.tagline { margin-top: 0; }
main {
  max-width: 950px;
  margin: auto;
  padding: 24px 16px;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 16px;
}
.card {
  background: white;
  border: 1px solid var(--lilac);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 4px 14px #59436f12;
}
.price { font-weight: bold; }
.order {
  display: inline-block;
  margin-top: 12px;
  padding: 12px 18px;
  background: #25D366;
  color: white;
  text-decoration: none;
  border-radius: 30px;
  font-weight: bold;
}
footer { text-align:center; padding:28px; }
</style>
</head>
<body>
<header>
  <h1>💜 Lilac Petal Studio</h1>
  <p class="tagline">Little Gifts, Endless Feelings.</p>
  <p>Thoughtful digital gifts, made with love.</p>
</header>
<main>
  <h2>Our Digital Gifts ✨</h2>
  <div class="products" id="products"></div>
</main>
<footer>Made with love by Lilac Petal Studio ♡</footer>
<script>
const products = [
  ["Animated Love Letter", "RM8"],
  ["Birthday Surprise Page", "RM15"],
  ["Our Story Anniversary Site", "RM25"],
  ["Interactive Gifts", "RM20"],
  ["Digital Scrapbook", "RM29"],
  ["Birthday Wishes Wall", "RM25"],
  ["Open When Letter Set", "RM15"],
  ["Fully Custom Dream Gift", "From RM30"]
];

// Replace this placeholder with your actual WhatsApp
// contact link generated by WhatsApp.
const whatsappLink = "https://wa.me/Anaaa2817.";

document.getElementById("products").innerHTML =
  products.map(([name, price]) => `
    <article class="card">
      <h3>${name}</h3>
      <p class="price">${price}</p>
      <p>A personalised digital gift created especially for someone you love.</p>
      <a class="order"
         href="${whatsappLink || '#contact'}"
         ${whatsappLink ? 'target="_blank" rel="noopener noreferrer"' : ''}
         onclick="${whatsappLink ? '' : "alert('Please add your WhatsApp contact link first.'); return false;"}">
         Place an Order via WhatsApp
      </a>
    </article>
  `).join("");
</script>
</body>
</html>
